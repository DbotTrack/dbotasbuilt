<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dbot Asbuilt</title>
    <meta
      name="description"
      content="Dbot Asbuilt makes precise 3D scans of buildings using LiDAR — as-built documentation you can measure, model and trust."
    />

    <!-- Favicons. Generated from public/logo.svg; the .ico covers older
         browsers and crawlers that ignore PNG icon links. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ebe9e5" />

    <!-- Link previews (WhatsApp / Slack / LinkedIn / X).
         NOTE: most crawlers require an ABSOLUTE url here — replace the two
         og:image / twitter:image paths with https://<your-domain>/og-image.png
         once the production domain is known. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dbot Asbuilt" />
    <meta property="og:title" content="Dbot Asbuilt — your building, captured to the millimetre" />
    <meta
      property="og:description"
      content="Precise LiDAR scans of any space — 360° walkthroughs, 2D drawings and 3D models for architects, interior designers and developers."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
